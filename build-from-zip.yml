name: Build Element X from ZIP

# ---------------------------------------------------------------------------
# 用途：仓库里只放「一个源码 zip」（比逐个上传 1 万多个文件快很多），
#       本工作流负责解压 → 配置环境 → 构建 → 上传 APK 产物。
#
# 仓库目录建议：
#   .github/workflows/build-from-zip.yml   <- 本文件
#   source/element-x-src.zip               <- 源码 zip（顶层为 element-x/）
#
# 触发方式：
#   1) 手动：Actions → "Build Element X from ZIP" → Run workflow
#   2) 自动：推送更新了 source/ 下的 zip 时
#
# 说明：Android SDK 使用 ubuntu runner 自带版本（与 Element 官方 CI 一致），
#       不再使用 android-actions/setup-android（老版本已与新 runner 不兼容）。
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Gradle 构建任务'
        required: false
        default: ':app:assembleGplayDebug'
      zip_path:
        description: '仓库内 zip 路径（留空则自动在 source/ 下查找 *.zip）'
        required: false
        default: ''
  push:
    paths:
      - 'source/**'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
    -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-configuration-cache

jobs:
  build:
    name: Build APK from source zip
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 若把 zip 用 Git LFS 存储，需要拉取真实文件
          lfs: true

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: 定位并解压源码 zip
        id: src
        run: |
          mkdir -p _extracted
          ZIP="${{ github.event.inputs.zip_path }}"
          # 支持：单个 zip / 分卷(zip -s: .z01+.zip) / 分割(.zip.001)
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            main=$(ls source/*.zip 2>/dev/null | head -n 1 || true)
            if [ -n "$main" ] && ls source/*.z[0-9]* >/dev/null 2>&1; then
              echo "检测到分卷 zip，正在合并…"
              cat $(ls source/*.z[0-9]* | sort) "$main" > _extracted/merged.zip
              ZIP=_extracted/merged.zip
            elif ls source/*.zip.[0-9]* >/dev/null 2>&1; then
              echo "检测到分割 zip，正在合并…"
              cat $(ls source/*.zip.[0-9]* | sort) > _extracted/merged.zip
              ZIP=_extracted/merged.zip
            else
              ZIP="$main"
            fi
          fi
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "::error::未找到 zip。请把源码 zip 放到 source/ 目录，或在手动触发时填写 zip_path。"
            exit 1
          fi
          echo "使用 zip: $ZIP ($(du -h "$ZIP" | cut -f1))"
          unzip -q "$ZIP" -d _extracted/out
          ROOT=$(dirname "$(find _extracted/out -maxdepth 4 -name settings.gradle.kts | head -n 1)")
          if [ -z "$ROOT" ] || [ "$ROOT" = "." ] || [ ! -d "$ROOT" ]; then
            echo "::error::未在 zip 中找到包含 settings.gradle.kts 的项目根目录。"
            exit 1
          fi
          echo "项目根目录: $ROOT"
          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: 安装 JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: 准备 Android SDK（使用 runner 自带）
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            for c in /usr/local/lib/android/sdk "$HOME/Android/Sdk" /opt/android-sdk; do
              if [ -d "$c" ]; then SDK="$c"; break; fi
            done
          fi
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::找不到 Android SDK（runner 未预装且未设置 ANDROID_HOME）"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK = $SDK"
          echo "--- platforms ---"; ls "$SDK/platforms" 2>/dev/null || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" 2>/dev/null || true
          # 仅当缺少 API 37 时才尝试补装（非致命）
          if ! ls -d "$SDK"/platforms/android-37* >/dev/null 2>&1; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SM" ]; then
              SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)
            fi
            if [ -z "$SM" ] || [ ! -x "$SM" ]; then SM="$(command -v sdkmanager || true)"; fi
            if [ -n "$SM" ]; then
              echo "缺少 API 37，尝试安装 platforms;android-37.0 / build-tools;37.0.0"
              yes | "$SM" --licenses >/dev/null 2>&1 || true
              "$SM" "platforms;android-37.0" "build-tools;37.0.0" >/dev/null 2>&1 || echo "::warning::SDK 37 安装失败，将使用 runner 自带版本"
              ls -d "$SDK"/platforms/android-37* 2>/dev/null || true
            else
              echo "::warning::未找到 sdkmanager，跳过补装"
            fi
          fi

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: 构建
        working-directory: ${{ steps.src.outputs.project_root }}
        run: |
          chmod +x ./gradlew
          ./gradlew ${{ github.event.inputs.task || ':app:assembleGplayDebug' }} $CI_GRADLE_ARG_PROPERTIES
        env:
          ELEMENT_ANDROID_MAPTILER_API_KEY: ${{ secrets.MAPTILER_KEY }}
          ELEMENT_ANDROID_MAPTILER_LIGHT_MAP_ID: ${{ secrets.MAPTILER_LIGHT_MAP_ID }}
          ELEMENT_ANDROID_MAPTILER_DARK_MAP_ID: ${{ secrets.MAPTILER_DARK_MAP_ID }}
          ELEMENT_ANDROID_SENTRY_DSN: ${{ secrets.ELEMENT_ANDROID_SENTRY_DSN }}
          ELEMENT_SDK_SENTRY_DSN: ${{ secrets.ELEMENT_SDK_SENTRY_DSN }}
          ELEMENT_CALL_SENTRY_DSN: ${{ secrets.ELEMENT_CALL_SENTRY_DSN }}
          ELEMENT_CALL_POSTHOG_API_HOST: ${{ secrets.ELEMENT_CALL_POSTHOG_API_HOST }}
          ELEMENT_CALL_POSTHOG_API_KEY: ${{ secrets.ELEMENT_CALL_POSTHOG_API_KEY }}
          ELEMENT_CALL_RAGESHAKE_URL: ${{ secrets.ELEMENT_CALL_RAGESHAKE_URL }}

      - name: 列出产物
        working-directory: ${{ steps.src.outputs.project_root }}
        run: |
          echo "=== APK ==="
          find app/build/outputs -name '*.apk' -exec ls -lh {} \; || true

      - name: 上传 APK 产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: elementx-apk
          path: |
            ${{ steps.src.outputs.project_root }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14